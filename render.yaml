services:
  - type: web
    name: studycompass-api
    runtime: node
    plan: free
    buildCommand: >-
      npm ci --include=dev &&
      npm run build --workspace @study-abroad/shared &&
      npx prisma generate &&
      npm run build --workspace @study-abroad/api &&
      npx prisma migrate deploy
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
